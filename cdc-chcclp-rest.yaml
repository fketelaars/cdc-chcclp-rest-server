---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cdc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cdc-restricted-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:restricted-v2
subjects:
- kind: ServiceAccount
  name: cdc
  namespace: cdc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"cdc-chcclp-rest:latest","namespace":"cdc"},"fieldPath":"spec.template.spec.containers[?(@.name==\"cdc-access-server\")].image"}]'
  labels:
    app: cdc-chcclp-rest
    app.kubernetes.io/component: cdc-chcclp-rest
    app.kubernetes.io/instance: cdc-chcclp-rest
    app.kubernetes.io/name: cdc-chcclp-rest
  name: cdc-chcclp-rest
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment: cdc-chcclp-rest
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        deployment: cdc-chcclp-rest
    spec:
      containers:
      - image: image-registry.openshift-image-registry.svc:5000/cdc/cdc-chcclp-rest:latest
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        name: cdc-chcclp-rest
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        startupProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 8080
          timeoutSeconds: 1
        envFrom:
        - configMapRef:
            name: cdc-chcclp-rest-config
            optional: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccount: cdc
      serviceAccountName: cdc
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: cdc-chcclp-rest
  labels:
    app: cdc-chcclp-rest
spec:
  selector:
    deployment: cdc-chcclp-rest
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cdc-chcclp-rest
  labels:
    app: cdc-chcclp-rest
spec:
  to:
    kind: Service
    name: cdc-chcclp-rest
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect