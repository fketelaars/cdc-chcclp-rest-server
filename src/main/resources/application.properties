# Server port
server.port=8080

# Global API prefix
server.servlet.context-path=/api/v1

# Debug logging for all REST calls (before/after each request with method, URI,
# headers, client IP, and body). Disable by changing DEBUG -> INFO in production.
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# CHCCLP session idle timeout (minutes). Sessions inactive longer than this are auto-closed.
chcclp.session.timeout-minutes=30

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true

# Bearer-token signing key used by TokenService (HMAC-SHA256).
# Override via the TOKEN_SIGNING_KEY environment variable or .env file.
# Use a long, random string in production.
auth.token.signing-key=${TOKEN_SIGNING_KEY:change-me-in-production}

# Connect server defaults (loaded from .env or environment variables).
# A POST /connect request may omit these fields; the values below are used as fallback.
connect.hostname=${CONNECT_HOSTNAME:}
connect.port=${CONNECT_PORT:0}
connect.username=${CONNECT_USERNAME:}
connect.password=${CONNECT_PASSWORD:}
